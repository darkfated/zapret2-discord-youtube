        repeats: 6
    - name: Discord медиа
      filter:
        tcp: 2053,2083,2087,2096,8443
        hostlist_domains:
        - discord.media
      desync:
      - func: fakedsplit
        pos: 1
        pattern: '0x00'
        fooling: ts
        repeats: 6
        blob: tls_google
    - name: Google/YouTube
      filter:
        tcp: 443
        hostlist:
        - google
        ip_id: zero
      desync:
      - func: fakedsplit
        pos: 1
        pattern: '0x00'
        fooling: ts
        repeats: 6
        blob: tls_google
    - name: Общий HTTPS
      filter:
        tcp: 80,443
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fakedsplit
        pos: 1
        pattern: '0x00'
        fooling: ts
        repeats: 6
        blob_fakes_tls:
        - stun
        - tls_google
        blob_fakes_http: tls_max
    - name: IPSet QUIC
      filter:
        udp: 443
        ipset: all
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 6
        blob: quic_google
    - name: IPSet HTTPS
