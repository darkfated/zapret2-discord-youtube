    category: fake+split
    description: Автоматический фейк TLS с перемешиванием пакетов. Высокая устойчивость.
    sections:
    - name: QUIC General
      filter:
        udp: 443
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 11
        blob: quic_google
    - name: Discord голос
      filter:
        udp: 19294-19344,50000-50100
        l7:
        - discord
        - stun
      desync:
      - func: fake
        blob: discord_active
        repeats: 6
    - name: Discord медиа
      filter:
        tcp: 2053,2083,2087,2096,8443
        hostlist_domains:
        - discord.media
      desync:
      - func: fake
        repeats: 11
        tcp_seq: -10000000
        tls_mod: rnd,dupsid,sni=www.google.com
      - func: multidisorder
        pos: 1,midsld
    - name: Google/YouTube
      filter:
        tcp: 443
        hostlist:
        - google
        ip_id: zero
      desync:
      - func: fake
        repeats: 11
        tcp_seq: -10000000
        tls_mod: rnd,dupsid,sni=www.google.com
      - func: multidisorder
        pos: 1,midsld
    - name: Общий HTTPS
      filter:
        tcp: 80,443
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 11
        tcp_seq: -10000000
        tls_mod: rnd,dupsid,sni=www.google.com
        blob_fakes_http: tls_max
      - func: multidisorder
        pos: 1,midsld
    - name: IPSet QUIC
      filter:
        udp: 443
        ipset: all
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 11
        blob: quic_google
    - name: IPSet HTTPS
      filter:
        tcp: 80,443,8443
        ipset: all
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 11
        tcp_seq: -10000000
        tls_mod: rnd,dupsid,sni=www.google.com
        blob_fakes_http: tls_max
      - func: multidisorder
        pos: 1,midsld
    - name: Игры TCP
      filter:
        tcp: '%GameFilterTCP%'
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 11
        tcp_seq: -10000000
        tls_mod: rnd,dupsid,sni=www.google.com
        any_protocol: true
        cutoff: n4
        blob_fakes_http: tls_max
        blob_fakes_unknown: tls_max
      - func: multidisorder
        pos: 1,midsld
    - name: Игры UDP
      filter:
        udp: '%GameFilterUDP%'
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 10
        blob: game_active
        any_protocol: true
        cutoff: n2
