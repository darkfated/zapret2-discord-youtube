strategies:
  default:
    description: 'Базовый режим: разбивает начальные пакеты TLS и добавляет фейковый
      QUIC для YouTube и Discord. Начните с него - работает в большинстве сетей.'
    name: Изумруд 1
    sections:
    - desync:
      - blob: quic_google
        func: fake
        repeats: 6
      filter:
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
        udp: 443
    - desync:
      - blob: discord_active
        func: fake
        repeats: 6
      filter:
        l7:
        - discord
        - stun
        udp: 19294-19344,50000-50100
    - desync:
      - func: multisplit
        pos: '1'
        seqovl: 681
        seqovl_pattern: tls_google
      filter:
        hostlist_domains:
        - discord.media
        tcp: 2053,2083,2087,2096,8443
    - desync:
      - func: multisplit
        pos: '1'
        seqovl: 681
        seqovl_pattern: tls_google
      filter:
        hostlist:
        - google
        ip_id: zero
        tcp: 443
    - desync:
      - func: multisplit
        pos: '1'
        seqovl: 568
        seqovl_pattern: tls_4pda
      filter:
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
        tcp: 80,443
    - desync:
      - blob: quic_google
        func: fake
        repeats: 6
      filter:
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
        udp: 443
    - desync:
      - func: multisplit
        pos: '1'
        seqovl: 568
        seqovl_pattern: tls_4pda
      filter:
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
        tcp: 80,443,8443
    - desync:
      - any_protocol: true
        cutoff: n3
        func: multisplit
        pos: '1'
        seqovl: 568
        seqovl_pattern: tls_4pda
      filter:
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
        tcp: '%GameFilterTCP%'
    - desync:
      - any_protocol: true
        blob: game_active
        cutoff: n2
        func: fake
        repeats: 12
      filter:
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
        udp: '%GameFilterUDP%'
