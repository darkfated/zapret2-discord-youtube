strategies:
  default:
    name: Изумруд
    category: multisplit
    description: Базовый режим. Работает в большинстве случаев, хорошо подходит для
      YouTube и Discord. Начните с него.
    sections:
    - name: QUIC общий
      filter:
        udp: 443
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 6
        blob: quic_google
    - name: Discord голос
      filter:
        udp: 19294-19344,50000-50100
        l7:
        - discord
        - stun
      desync:
      - func: fake
        blob: discord_active
        repeats: 6
    - name: Discord медиа
      filter:
        tcp: 2053,2083,2087,2096,8443
        hostlist_domains:
        - discord.media
      desync:
      - func: multisplit
        pos: '1'
        seqovl: 681
        seqovl_pattern: tls_google
    - name: Google/YouTube
      filter:
        tcp: 443
        hostlist:
        - google
        ip_id: zero
      desync:
      - func: multisplit
        pos: '1'
        seqovl: 681
        seqovl_pattern: tls_google
    - name: Общий HTTPS
      filter:
        tcp: 80,443
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: multisplit
        pos: '1'
        seqovl: 568
        seqovl_pattern: tls_4pda
    - name: IPSet QUIC
      filter:
        udp: 443
        ipset: all
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 6
        blob: quic_google
    - name: IPSet HTTPS
      filter:
        tcp: 80,443,8443
        ipset: all
        hostlist_exclude:
        - exclude
        - exclude-user
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: multisplit
        pos: '1'
        seqovl: 568
        seqovl_pattern: tls_4pda
    - name: Игры TCP
      filter:
        tcp: '%GameFilterTCP%'
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: multisplit
        pos: '1'
        seqovl: 568
        seqovl_pattern: tls_4pda
        any_protocol: true
        cutoff: n3
    - name: Игры UDP
      filter:
        udp: '%GameFilterUDP%'
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fake
        repeats: 12
        blob: game_active
        any_protocol: true
        cutoff: n2
  alt:
    name: Кобальт
    category: fake+split
    description: Облегченный режим с подменой временных меток. Помогает, если Изумруд
      не работает.
    sections:
    - name: QUIC общий
      filter:
        udp: 443
        hostlist:
        - general
        - general-user
        hostlist_exclude:
        - exclude
        - exclude-user
