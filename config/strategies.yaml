        blob_fakes_tls:
        - stun
        - tls_google
        blob_fakes_http: tls_max
    - name: Игры TCP
      filter:
        tcp: '%GameFilterTCP%'
        ipset: all
        ipset_exclude:
        - exclude
        - exclude-user
      desync:
      - func: fakedsplit
        pos: 1
        pattern: '0x00'
        fooling: ts
        repeats: 6
        any_protocol: true
        cutoff: n4
        blob_fakes_tls:
        - stun
        - tls_google
        blob_fakes_http: tls_max
        blob_fakes_unknown:
        - stun
        - tls_google
    - name: Игры UDP
